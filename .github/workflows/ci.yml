name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'startdown/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./startdown
      run: npm ci

    - name: Build Frontend
      working-directory: ./startdown
      run: npm run build

    - name: Install Backend Dependencies
      working-directory: ./startdown/server
      run: npm ci
